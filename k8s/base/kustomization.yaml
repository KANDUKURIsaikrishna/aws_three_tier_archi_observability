apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
- storageclass/gp3.yaml
- namespace.yaml
- limitrange.yaml
- secrets/external-secret.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- ingress/ingress.yaml
- network-policy/network-policy.yaml
- pdb/pdb.yaml
- quota.yaml
# No ServiceMonitor/PrometheusRule (monitoring.coreos.com/v1) here. The old
# in-repo manifests under monitoring/ were removed (2026-08-29): this cluster
# runs no Prometheus Operator to consume them, and an unknown CRD type fails
# the ENTIRE ArgoCD sync batch, not just that one resource (ComparisonError/
# SyncFailed on a real bookstore Application — TROUBLESHOOTING.md OBS-012).
# Prometheus lives on a standalone EC2 instance (see ARCHITECTURE.md) and
# scrapes via static + file_sd configs, not ServiceMonitor discovery. Don't
# re-add them here. The old monitoring/analysis-template.yaml (argoproj.io/
# v1alpha1, Argo Rollouts' CRD) went the same way, with the backend monolith
# whose canary rollout it gated.
