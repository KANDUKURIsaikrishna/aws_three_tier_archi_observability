# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD ApplicationSet — Bookstore microservices (DR standby cluster).
#
# Same list generator as k8s/argocd/applicationset-microservices.yaml; the
# only difference is `path`, which points at each service's overlays/dr
# (us-west-2 ECR images; secrets resolve via the DR ClusterSecretStore).
# Applied by terraform/dr-standby.tf.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookstore-microservices
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: catalog-service
            namespace: catalog
          - service: user-service
            namespace: user
          - service: notification-service
            namespace: notification
          - service: order-service
            namespace: order
          - service: api-gateway
            namespace: gateway

  template:
    metadata:
      name: '{{service}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookstore
      source:
        repoURL: https://github.com/YOUR_GITHUB_USERNAME/aws_three_tier_code.git
        targetRevision: main
        path: 'k8s/services/{{service}}/overlays/dr'
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
