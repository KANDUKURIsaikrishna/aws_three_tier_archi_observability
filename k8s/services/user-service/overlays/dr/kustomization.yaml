apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DR standby overlay (us-west-2) for user-service. Structured like overlays/prod
# (references ../../base directly, which already sets the namespace) so this
# images: block is authoritative — the image is pulled from the us-west-2
# ECR replica. 000000000000 and the tag are stamped by CI as for overlays/prod.

resources:
  - ../../base

images:
  - name: bookstore-user-service
    newName: 000000000000.dkr.ecr.us-west-2.amazonaws.com/bookstore-user-service
    newTag: e8be5505
