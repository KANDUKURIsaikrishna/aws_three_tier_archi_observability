# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD ApplicationSet — Bookstore Microservices
#
# One Application per entry in the list generator below. Each new microservice
# plan (user-service, order-service, notification-service, api-gateway) adds
# one more element here instead of a hand-written Application manifest.
#
# targetRevision (below, in the template) is stamped from config.env's
# GITHUB_BRANCH by scripts/configure.py, defaulting to "main" if unset --
# NOT hand-edited here. Keep this config-driven, not hardcoded, matching
# k8s/argocd/application.yaml -- a branch name copied over from a different
# repo/branch layout than the one actually deployed breaks ArgoCD sync
# outright if that branch doesn't exist in the real repo.
#
# Prerequisites: same as k8s/argocd/application.yaml (ArgoCD installed, repo
# credentials registered if private), plus the scoped AppProject. Apply once:
#   kubectl apply -f k8s/argocd/appproject.yaml
#   kubectl apply -f k8s/argocd/applicationset-microservices.yaml
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookstore-microservices
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: catalog-service
            namespace: catalog
          - service: user-service
            namespace: user
          - service: notification-service
            namespace: notification
          - service: order-service
            namespace: order
          - service: api-gateway
            namespace: gateway

  template:
    metadata:
      name: '{{service}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookstore   # scoped AppProject, see k8s/argocd/appproject.yaml -- apply that first

      source:
        repoURL: https://github.com/YOUR_GITHUB_USERNAME/aws_three_tier_code.git
        targetRevision: main
        path: 'k8s/services/{{service}}/overlays/prod'
        kustomize: {}

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
